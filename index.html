<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo Veste Bene — Sartorial & Technical Menswear</title>
    <meta name="description" content="Selezione esclusiva di abbigliamento uomo di alta gamma, rigorosamente nuovo con cartellino. Autenticità garantita e misurazione sartoriale.">
    
    <!-- Google Fonts: Tipografia Editoriale di Lusso -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #09090B;
            --bg-secondary: #111114;
            --bg-card: #16161A;
            --gold: #C6A355;
            --gold-light: #DFC27D;
            --gold-dim: rgba(198, 163, 85, 0.18);
            --text-primary: #F5F5F7;
            --text-secondary: #A1A1AA;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(198, 163, 85, 0.35);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            --transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(198, 163, 85, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- HEADER / HERO --- */
        header {
            text-align: center;
            padding: 64px 0 44px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 16px;
        }

        .monogram {
            width: 56px;
            height: 56px;
            margin: 0 auto 20px;
            border: 1px solid var(--border-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 22px;
            letter-spacing: 0.1em;
            color: var(--gold);
            background: rgba(198, 163, 85, 0.04);
        }

        h1 {
            font-family: var(--font-serif);
            font-size: clamp(2.4rem, 6vw, 3.6rem);
            font-weight: 600;
            letter-spacing: 0.04em;
            line-height: 1.1;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .subtitle {
            font-size: 14px;
            font-weight: 300;
            color: var(--text-secondary);
            max-width: 520px;
            margin: 0 auto 32px;
            letter-spacing: 0.02em;
        }

        /* --- PRIMARY & SOCIAL LINKS --- */
        .cta-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 460px;
            margin: 0 auto;
        }

        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 26px;
            background: linear-gradient(135deg, var(--gold) 0%, #B38E3E 100%);
            color: #09090B;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            transition: var(--transition);
            border: 1px solid var(--gold-light);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(198, 163, 85, 0.25);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
        }

        .social-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-secondary {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 16px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            transition: var(--transition);
        }

        .btn-secondary:hover {
            border-color: var(--border-gold);
            background-color: var(--bg-card);
            color: var(--gold-light);
        }

        .btn-secondary svg, .btn-primary svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* --- SECTIONS COMMON --- */
        section {
            padding: 52px 0;
            border-bottom: 1px solid var(--border-subtle);
        }

        .section-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .section-tag {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--gold);
            display: block;
            margin-bottom: 8px;
        }

        h2 {
            font-family: var(--font-serif);
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: var(--text-primary);
        }

        /* --- PILLARS / PROTOCOLLO GARANZIA --- */
        .pillars-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .pillar-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            padding: 26px 20px;
            text-align: center;
            transition: var(--transition);
        }

        .pillar-card:hover {
            border-color: var(--border-gold);
            transform: translateY(-2px);
        }

        .pillar-icon {
            width: 36px;
            height: 36px;
            margin: 0 auto 14px;
            color: var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pillar-card h3 {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .pillar-card p {
            font-size: 12.5px;
            font-weight: 300;
            color: var(--text-secondary);
            line-height: 1.55;
        }

        .scarcity-banner {
            margin-top: 24px;
            padding: 14px 20px;
            background: rgba(198, 163, 85, 0.06);
            border-left: 2px solid var(--gold);
            font-size: 12.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .scarcity-banner strong {
            color: var(--gold-light);
            font-weight: 500;
        }

        /* --- ACCORDION GUIDA TAGLIE --- */
        .accordion {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        details {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }

        details[open] {
            border-color: var(--border-gold);
        }
